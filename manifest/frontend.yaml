# Frontend pods: keeps 1 copy of the Next.js app running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sanchar-frontend
  namespace: sanchar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sanchar-frontend
  template:
    metadata:
      labels:
        app: sanchar-frontend
    spec:
      containers:
        - name: frontend
          image: 572824491336.dkr.ecr.ap-south-1.amazonaws.com/sanchar/frontend:50fbb03
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: sanchar-front     # BACKEND_URL must be http://sanchar-backend:8000
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
---
# Stable name "sanchar-frontend" inside the cluster; the Ingress will point here.
apiVersion: v1
kind: Service
metadata:
  name: sanchar-frontend
  namespace: sanchar
spec:
  type: LoadBalancer  
  selector:
    app: sanchar-frontend
  ports:
    - port: 80
      targetPort: 3000

